# A tag vX.Y.Z checks the release: the tests run again and the source archive (code, docs, data and the asset pack —
# unpack, run start.cmd / start.sh) and its notes (the tag's section of CHANGELOG.md) are built and kept as the run's
# artifact. The GitHub Release itself is published by the maintainer's own account (gh release create, with the same
# archive and notes), not by the workflow.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to check again, e.g. v0.2.0'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Checks and tests
        run: |
          node tools/check.mjs
          npm test

      - name: Source archive and notes
        id: pack
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          git archive --format=zip --prefix="duel-channel-${ver}/" -o "duel-channel-${ver}-source.zip" HEAD
          # the "## [x.y.z]" section of CHANGELOG.md, up to the next "## "
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见 CHANGELOG.md" > notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Keep the archive and notes
        uses: actions/upload-artifact@v7
        with:
          name: duel-channel-${{ steps.pack.outputs.ver }}
          path: |
            duel-channel-${{ steps.pack.outputs.ver }}-source.zip
            notes.md
