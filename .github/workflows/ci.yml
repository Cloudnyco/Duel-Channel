name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # the template, the page sources parsed together, the data files, nothing from the asset pack tracked
      - name: Static checks
        run: node tools/check.mjs

      # the sim (determinism, golden battles, official rules) and a whole match of 8 bots through the server
      - name: Tests
        run: npm test

      # the gateway and its instances boot; /healthz and /status answer; without a built page the gateway says so (503)
      - name: Server smoke test
        shell: bash
        run: |
          node server/launch.mjs --instances 2 > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8600/healthz -o health.json && grep -q '"instances":2' health.json; then ok=1; break; fi
            sleep 1
          done
          cat health.json || true
          echo
          [ -n "$ok" ] || { cat server.log; kill $pid || true; exit 1; }
          curl -fsS -o status.json http://127.0.0.1:8600/status
          grep -q '"instances"' status.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8600/)
          [ "$code" = "503" ] || { echo "expected 503 without a built page, got $code"; cat server.log; kill $pid || true; exit 1; }
          kill $pid || true

      # the one-step hosting script (start.sh on Linux, tools/host.mjs behind start.cmd on Windows): with the committed
      # asset pack it installs, builds the page (fetching the display fonts) and checks the ports, stopping before the
      # server (--dry-run); without a pack it stops at once and says what to do
      - name: Hosting script
        shell: bash
        run: |
          code=0
          if [ "$RUNNER_OS" = "Windows" ]; then out=$(node tools/host.mjs --local --no-open --dry-run 2>&1) || code=$?
          else out=$(./start.sh --local --no-open --dry-run 2>&1) || code=$?; fi
          echo "$out"
          if [ -f assets/ui.json ]; then
            [ "$code" = "0" ] || { echo "expected exit 0, got $code"; exit 1; }
            ls -l public/index.html public/pack/
          else
            [ "$code" = "1" ] || { echo "expected exit 1, got $code"; exit 1; }
            echo "$out" | grep -q 'docs/ASSETS.md'
          fi

      # the built page the way browsers get it: the code (brotli), then the asset pack it names (cacheable for good)
      - name: Page served
        if: hashFiles('assets/ui.json') != ''
        shell: bash
        run: |
          node server/launch.mjs --instances 1 > page.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8600/healthz > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -H 'Accept-Encoding: br' -D page.h -o /dev/null http://127.0.0.1:8600/
          grep -qi '^content-encoding: br' page.h || { cat page.h; kill $pid; exit 1; }
          pack=$(curl -fsS http://127.0.0.1:8600/ | grep -o 'pack/duel-pack\.[0-9a-f]\{16\}\.json' | head -1)
          [ -n "$pack" ] || { echo "the page names no asset pack"; kill $pid; exit 1; }
          curl -fsS -H 'Accept-Encoding: br' -D pack.h -o /dev/null "http://127.0.0.1:8600/$pack"
          cat pack.h
          grep -qi '^cache-control: public, max-age=31536000, immutable' pack.h || { kill $pid; exit 1; }
          kill $pid || true

  # once, not per matrix entry
  tooling:
    name: tooling (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  # the server image builds (no push here; see docker.yml)
  docker:
    name: docker (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: duel-channel:ci
